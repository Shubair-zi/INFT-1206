
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silly story generator</title>
<style>
body {
  font: 1.2em / 1.5 system-ui;
  margin: 0 auto;
  width: 500px;
}

fieldset {
  border: 0;
}

fieldset,
legend {
  padding: 0;
  margin: 0;
}

input[type="text"] {
  margin-top: 5px;
  padding: 5px;
  width: 50%;
  display: block;
}

div,
fieldset {
  margin-top: 20px;
}

p {
  margin-top: 10px;
  background: #ffc125;
  padding: 20px;
  visibility: hidden;
}
</style>
</head>
<body>
  <div>
    <label for="custom-name">Enter custom name:</label>
    <input id="custom-name" type="text" placeholder="" />
  </div>
  <fieldset>
    <legend>Choose locale:</legend>
    <label for="us">US</label
    ><input id="us" type="radio" name="uk-us" value="us" checked />
    <label for="uk">UK</label
    ><input id="uk" type="radio" name="uk-us" value="uk" />
  </fieldset>
  <div>
    <button class="generate">Generate random story</button>
  </div>
  <p class="story"></p>
  <script src="main.js"></script>
</body>
</html>
